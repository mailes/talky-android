// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.5.0'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
    }
}
repositories {
    google()
}

// Private configuration is local-only; command-line properties and environment variables also work.
def talkyPrivateProperties = new Properties()
def talkyPrivateFile = rootProject.file('private-build.properties')
if (talkyPrivateFile.exists()) {
    talkyPrivateFile.withInputStream { talkyPrivateProperties.load(it) }
}
def talkySetting = { String name ->
    def value = rootProject.findProperty(name) ?: talkyPrivateProperties.getProperty(name) ?: System.getenv(name)
    return value == null ? '' : value.toString()
}
ext.talkySettings = [
    apiId: talkySetting('TALKY_API_ID'),
    apiHash: talkySetting('TALKY_API_HASH'),
    mapsKey: talkySetting('TALKY_GOOGLE_MAPS_KEY'),
    safetyNetKey: talkySetting('TALKY_SAFETYNET_KEY'),
    googleClientId: talkySetting('TALKY_GOOGLE_AUTH_CLIENT_ID'),
    huaweiAppId: talkySetting('TALKY_HUAWEI_APP_ID'),
    storeFile: talkySetting('TALKY_RELEASE_STORE_FILE'),
    storePassword: talkySetting('TALKY_RELEASE_STORE_PASSWORD'),
    keyAlias: talkySetting('TALKY_RELEASE_KEY_ALIAS'),
    keyPassword: talkySetting('TALKY_RELEASE_KEY_PASSWORD')
]

// Strip JLatexMath fonts we don't ship (transitive AAR assets from
// io.noties.markwon:ext-latex -> ru.noties:jlatexmath-android, ~764 KB total under
// assets/org/scilab/forge/jlatexmath/fonts/). Has to live in the APK modules — a
// library's androidResources.ignoreAssetsPattern doesn't filter packaging in apps
// that consume it. Using subprojects keeps it in one place.
//   keep:  base/, latin/, maths/, euler/  (\mathbb, \mathcal, \mathfrak still work)
//   drop:  latin/optional/, maths/optional/  (~290 KB; \textbf/\textit/\mathds fall back)
//          licences/                          (~20 KB; pure license text files)
subprojects {
    plugins.withId('com.android.application') {
        android {
            defaultConfig.manifestPlaceholders += [TALKY_GOOGLE_MAPS_KEY: rootProject.ext.talkySettings.mapsKey]
            androidResources {
                ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~:!optional:!licences:!*stmary*:!*eufb*'
            }
        }
    }

    if (project.projectDir.absolutePath.contains('/TMessagesProj_Modules/media/')) {
        project.plugins.withId('com.android.library') {
            project.android {
                if (namespace == null) {
                    def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")

                    if (manifestFile.exists()) {
                        def manifest = new XmlSlurper().parse(manifestFile)
                        def manifestPackage = manifest.@package.text()

                        if (manifestPackage) {
                            namespace manifestPackage
                        }
                    }
                }
            }
        }
    }
}